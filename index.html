function freshReview(){return {unlocked:false,items:[{id:null,step:0},{id:null,step:0}]};}
function inReview(){return pending && typeof pending==='object' && Number.isInteger(pending.review);}
function lessonProgress(){return inReview()?S.review.items[pending.review].step:(S.learn[selected]||0);}
function lessonLimit(){return inReview()?3:2;}
function reviewQuestion(f){const kind=['doner','sushi','potato'].includes(f.id)?'protein':['rice','lentil'].includes(f.id)?'fiber':['pizza','leaves'].includes(f.id)?'fat':'carb';const questions={protein:['Was macht Eiweiß im Körper?','Що робить білок в організмі?'],fiber:['Wobei helfen Ballaststoffe?','Чому допомагає клітковина?'],fat:['Wobei hilft Fett dem Körper?','Чому допомагає жир в організмі?'],carb:['Was liefern Kohlenhydrate dem Körper?','Що дають організму вуглеводи?']};const answers=[['Energie für Gehirn und Muskeln','Енергію для мозку та м’язів'],['Baustoff für Muskeln und andere Körperteile','Будівельний матеріал для м’язів та інших частин тіла'],['Hilfe bei der Verdauung','Допомогу травленню'],['Hilfe beim Aufnehmen bestimmter Vitamine','Допомогу в засвоєнні певних вітамінів']];return {q:questions[kind],answers,right:{carb:0,protein:1,fiber:2,fat:3}[kind]};}
function reviewPage(){if(!S.review.unlocked)return `<div class="hint">${t('Verbessere zuerst deine Woche und schließe sie ab.','Спочатку покращ свій тиждень і заверши його.')}</div>`;const done=S.review.items.filter(x=>x.step>=3).length;return `<div class="eyebrow">${t('Zum Abschluss · Wissen festhalten','На завершення · Закріпи знання')}</div><div class="topline"><h1 style="font-size:36px">${t('Meine zwei Gerichte','Мої дві страви')}</h1><span class="chip">${done} / 2 ${t('Analysen wiederholt','аналізи повторено')}</span></div><p class="lead">${t('Wähle zwei verschiedene Gerichte. Wiederhole ihre Analyse. Danach kannst du die fertigen Übersichten abschreiben.','Обери дві різні страви. Повтори їхній аналіз. Потім перепиши готові огляди.')}</p><div class="reviewchoices">${S.review.items.map((item,i)=>{const f=F(item.id);return `<section class="card"><div class="eyebrow">${t('Gericht','Страва')} ${i+1}</div><h2>${f?f.emoji+' '+L(f.name):t('Noch auswählen','Ще не обрано')}</h2><p>${f?L(f.portion):t('Döner, Pizza, Sushi und weitere Gerichte stehen zur Wahl.','Можна обрати донер, піцу, суші та інші страви.')}</p><div class="actions"><button onclick="reviewPicker(${i})">${f?t('Anderes Gericht wählen','Обрати іншу страву'):t('Gericht auswählen','Обрати страву')}</button>${f&&item.step<3?`<button class="primary" onclick="resumeReview(${i})">${item.step?t('Analyse fortsetzen','Продовжити аналіз'):t('Analyse wiederholen','Повторити аналіз')} · ${item.step}/3</button>`:''}</div>${f&&item.step>=3?`<div class="hint good">✓ ${t('Übersicht unten freigeschaltet','Огляд нижче відкрито')}</div>`:f?`<div class="hint">🔒 ${t('Die Übersicht erscheint nach drei richtigen Antworten.','Огляд з’явиться після трьох правильних відповідей.')}</div>`:''}</section>`;}).join('')}</div>${done===2?`<div class="hint good"><strong>${t('Geschafft! Beide Übersichten sind freigeschaltet.','Готово! Обидва огляди відкрито.')}</strong><br>${t('Schreibe die Überschriften und Sätze ordentlich auf dein Arbeitsblatt ab.','Охайно перепиши заголовки та речення у свій робочий аркуш.')}</div>`:''}${S.review.items.map((item,i)=>item.step>=3?summaryCard(item.id,i):'').join('')}<p class="muted">${t('Deine Auswahl und die freigeschalteten Übersichten bleiben in diesem Browser gespeichert.','Твій вибір та відкриті огляди зберігаються в цьому браузері.')}</p>`;}
function reviewPicker(index){if(!S.review.unlocked)return;selected=null;pending={review:index};const other=S.review.items[1-index].id;openModal(`<h2>${t('Wähle Gericht','Обери страву')} ${index+1}</h2><p>${t('Wähle ein anderes Gericht als im zweiten Feld.','Обери іншу страву, ніж в іншому полі.')}</p><div class="catalog">${FOODS.filter(f=>REVIEW_ROWS[f.id]&&f.id!==other).map(f=>`<button class="food" onclick="selectReview('${f.id}',${index})"><span class="food-art">${f.emoji}</span><span class="food-body"><strong>${L(f.name)}</strong><small>${L(f.portion)}</small><span class="badge">${t('Analyse wiederholen','Повторити аналіз')}</span></span></button>`).join('')}</div>`);}
function selectReview(id,index){if(!S.review.unlocked||![0,1].includes(index)||!REVIEW_ROWS[id]||S.review.items[1-index].id===id)return;const old=S.review.items[index];if(old.id!==id)S.review.items[index]={id,step:0};save();resumeReview(index);}
function resumeReview(index){if(!S.review.unlocked||!S.review.items[index]?.id)return;inspect(S.review.items[index].id,{review:index});}
function summaryCard(id,index){const f=F(id);return `<section class="card copycard"><div class="eyebrow">${t('Übersicht zum Abschreiben','Огляд для переписування')} · ${index+1}</div><h2>${f.emoji} ${L(f.name)}</h2><p class="muted">${L(f.portion)}</p><div class="chainlabels"><span>${t('Zutat','Складник')}</span><span>${t('Nährstoff','Поживна речовина')}</span><span>${t('Aufgabe im Körper','Роль в організмі')}</span></div>${REVIEW_ROWS[id].map((pair,i)=>{const r=pair[S.lang];return `<div class="copyrow"><div class="chain"><strong>${r[0]}</strong><span>${r[1]}</span><span>${r[2]}</span></div><p class="copysentence"><b>${i+1}.</b> ${t('Das Gericht enthält ','Страва містить ')}${r[0]}. ${t('So liefert es ','Так вона дає ')}${r[1]}. ${r[2]}</p></div>`}).join('')}<small>${t('Das sind wichtige Beispiele. Zutaten können noch weitere Nährstoffe liefern. Wir beschreiben unser Beispielrezept.','Це важливі приклади. Складники можуть давати й інші поживні речовини. Ми описуємо наш приклад рецепта.')}</small></section>`;}

function render(){header();$('app').innerHTML=(S.view==='start'?start():nav()+(S.view==='catalog'?catalog():S.view==='report'?report():S.view==='review'?reviewPage():planner()))+footer();if(!storageOK)$('app').insertAdjacentHTML('afterbegin',`<div class="hint warn">${t('Speichern ist in diesem Browser nicht verfügbar. Lass die Seite geöffnet.','Збереження недоступне. Залиш сторінку відкритою.')}</div>`);}
function start(){return `<div class="eyebrow">${t('Ernährung • Dein Wissen im Alltag','Харчування • Знання в житті')}</div><section class="hero"><div class="hero-copy"><h1>${t('Was steckt in<br>deiner Woche?','Що є у твоєму<br>тижні?')}</h1><p class="lead">${t('Erkunde Gerichte. Versorge Sam. Mach deine Woche abwechslungsreicher.','Досліджуй страви. Годуй Сема. Зроби свій тиждень різноманітнішим.')}</p><p class="muted">${t('Dein Lieblingsessen darf bleiben. Du entscheidest, was dazu passt.','Улюблена їжа може залишитися. Ти обираєш, що додати.')}</p><button class="lime" onclick="go('plan')">${t('Meine Woche starten →','Почати мій тиждень →')}</button></div><div class="hero-visual">${figure()}<span style="position:absolute;left:12%;top:25%;font-size:55px">🥙</span><span style="position:absolute;right:12%;bottom:20%;font-size:50px">🍎</span><span class="bubble">${t('Hi, ich bin Sam!','Привіт, я Сем!')}</span></div></section><div class="steps">${[[t('Eine Woche planen','Планувати тиждень'),t('Wähle Mahlzeiten für sieben Tage. Neue Gerichte erkundest du beim Auswählen.','Обери страви на сім днів. Нові страви досліджуй під час вибору.')],[t('Drei Stellen verbessern','Покращити три місця'),t('Schau zurück. Verändere deine Auswahl und erkläre warum.','Переглянь тиждень. Зміни вибір і поясни чому.')],[t('Zwei Gerichte wiederholen','Повтори дві страви'),t('Wiederhole die Analyse. Schreibe danach deine Übersichten ab.','Повтори аналіз. Потім перепиши свої огляди.')]].map((x,i)=>`<div class="card"><div class="stepno">${i+1}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`}
function nav(){return `<div class="tabs"><button class="${S.view==='plan'?'active':''}" onclick="go('plan')">${t('1. Meine Woche','1. Мій тиждень')}</button><button class="${S.view==='catalog'?'active':''}" onclick="go('catalog')">${t('2. Gerichte-Labor','2. Лабораторія страв')} · ${Object.values(S.learn).filter(x=>x>=2).length}/${FOODS.length}</button><button class="${S.view==='report'?'active':''}" onclick="go('report')">${t('3. Rückblick & verbessern','3. Огляд і покращення')} ${allDone()?'':'🔒'}</button><button class="${S.view==='review'?'active':''}" onclick="go('review')">${t('4. Meine zwei Gerichte','4. Мої дві страви')} ${S.review.unlocked?'':'🔒'}</button></div>`}
function entries(day){return [...day.meals,...day.extras].filter(id=>F(id));}
function totals(day){return entries(day).reduce((a,id)=>a.map((v,i)=>v+F(id).v[i]),Array(8).fill(0));}
function flags(days,key){return days.flatMap(entries).filter(id=>F(id).flags.includes(key)).length;}
function fmt(n){return Number(n.toFixed(1)).toLocaleString(S.lang?'uk-UA':'de-DE');}
function bars(day){const a=totals(day);return GROUPS.map((g,i)=>`<div class="barrow ${i>=6&&a[i]>g[2]?'over':''}"><div class="barlabel"><span>${g[S.lang]}</span><strong>${fmt(a[i])} / ${g[2]}</strong></div><div class="bar"><span style="width:${Math.min(100,a[i]/g[2]*100)}%"></span></div></div>`).join('');}
function planner(){const day=S.days[S.day],count=S.days.filter(d=>d.done).length;return `<div class="topline"><div><div class="eyebrow">${S.original?t('Verbessere deine Woche','Покращуй свій тиждень'):t('Dein Wochenplan','Твій план на тиждень')}</div><h1 style="font-size:36px">${L(DAYS[S.day])}</h1></div><span class="chip">${count} / 7 ${t('Tage geplant','днів заплановано')}</span></div><div class="progress"><span style="width:${count/7*100}%"></span></div><div class="days">${DAYS.map((d,i)=>`<button aria-label="${L(d)}" class="${S.day===i?'active ':''}${S.days[i].done?'done':''}" onclick="setDay(${i})">${L(d).slice(0,2)}${S.days[i].done?' ✓':''}</button>`).join('')}</div><div class="layout"><section><p class="muted">${t('Wähle drei Mahlzeiten. Ergänze Getränke und kleine Portionen nach Bedarf.','Обери три прийоми їжі. Додавай напої та невеликі порції за потреби.')}</p>${SLOTS.map((s,i)=>{const f=F(day.meals[i]);return `<div class="meal"><div class="meal-icon">${f?f.emoji:['🌅','☀️','🌙'][i]}</div><div><div class="eyebrow">${L(s)}</div><h3>${f?L(f.name):t('Noch offen','Ще не обрано')}</h3><p>${f?L(f.portion):t('Was bekommt Sam?','Що отримає Сем?')}</p></div><div class="actions"><button class="small ${f?'':'primary'}" onclick="picker(${i})">${f?t('Ändern','Змінити'):t('Auswählen','Обрати')}</button>${f?`<button class="small" onclick="inspect('${f.id}')">ⓘ</button>`:''}</div></div>`}).join('')}<div class="card"><h3>${t('Dazu passt …','Можна додати …')}</h3><p class="muted">${t('Getränke, Beilagen und kleine Zwischenmahlzeiten.','Напої, гарніри та невеликі перекуси.')}</p><div class="extras">${day.extras.map((id,i)=>`<div class="extra"><span>${F(id).emoji} ${L(F(id).name)}</span><button aria-label="${t('Entfernen','Видалити')} ${L(F(id).name)}" onclick="removeExtra(${i})">×</button></div>`).join('')}</div><button onclick="picker('extra')">＋ ${t('Ergänzung auswählen','Обрати доповнення')}</button> <button onclick="water()">💧 + ${t('Glas Wasser','Склянка води')}</button></div>${dayHint(day)}<div class="topline" style="margin-top:20px"><button class="primary" ${day.meals.some(x=>!x)?'disabled':''} onclick="finishDay()">${S.day===6?t('Woche anschauen →','Переглянути тиждень →'):t('Tag fertig · weiter →','День готовий · далі →')}</button>${S.original?`<button onclick="go('report')">${t('Änderungen ansehen','Переглянути зміни')}</button>`:''}</div><small>${t('Erst drei Mahlzeiten auswählen. Du kannst später alles verändern.','Спочатку обери три прийоми їжі. Пізніше все можна змінити.')}</small></section><aside class="sidebar card"><div id="scene" class="scene">${figure()}<span class="bubble">${t('Was gibt’s heute?','Що сьогодні їмо?')}</span></div><h3>${t('Heute gesammelt','За сьогодні')}</h3><small>${t('Portionen · grobe Orientierung','Порції · приблизний орієнтир')}</small>${bars(day)}<details><summary>${t('Wie zählen die Balken?','Як працюють смужки?')}</summary><p class="muted" style="font-size:13px">${t('Die Zahlen orientieren sich an den acht Gruppen der BZfE-Pyramide. Unsere Beispielgerichte sind grob in Portionen aufgeteilt. Das sind keine gemessenen Nährstoffwerte. Fett aus Käse, Fisch oder Nüssen steckt nicht im Öl-Balken. Extras musst du nicht auffüllen. Der persönliche Bedarf hängt auch von Wachstum und Bewegung ab.','Числа орієнтуються на вісім груп піраміди BZfE. Страви приблизно поділено на порції. Це не виміряні поживні речовини. Жир із сиру, риби чи горіхів не входить у смужку олії. Ласощі не потрібно заповнювати. Потреби залежать також від росту та руху.')}</p></details></aside></div>`}
function dayHint(d){let a=totals(d);if(!entries(d).length)return '';let msg=a[7]>1?t('Heute sind mehrere Extras dabei. Schau, ob du eines durch eine andere Ergänzung ersetzen möchtest.','Сьогодні кілька порцій ласощів. Можеш замінити одну іншим доповненням.'):a[6]>2?t('In unseren Rezepten steckt heute viel zugesetztes Öl oder Fett. Auch günstige Öle liefern viel Energie. Schau dir die Zusammenstellung an.','У наших рецептах сьогодні багато доданої олії або жиру. Навіть корисні олії дають багато енергії. Переглянь склад.'):a[1]<5?t('Obst und Gemüse kannst du heute noch ergänzen. Die Balken sind eine Orientierung, kein Test.','Сьогодні можна ще додати фруктів та овочів. Смужки — орієнтир, а не тест.'):a[0]<6?t('Denk auch ans Trinken über den Tag. Wasser ist noch wenig dabei.','Не забувай пити протягом дня. Води поки мало.'):t('Du hast verschiedene Gruppen eingeplant. Schau auch auf Abwechslung über die Woche.','Ти запланував різні групи. Подбай і про різноманіття протягом тижня.');return `<div class="hint ${a[7]>1||a[6]>2?'red':''}">${msg}</div>`}
function catalogCards(foods,pick=false){return `<div class="catalog">${foods.map(f=>`<button class="food" onclick="${pick?`choose('${f.id}')`:`inspect('${f.id}')`}"><span class="food-art" aria-hidden="true">${f.emoji}</span><span class="food-body"><strong>${L(f.name)}</strong><small>${L(f.portion)}</small><span class="badge">${S.learn[f.id]>=2?t('✓ Erkundet','✓ Досліджено'):t('⌕ Erst entdecken','⌕ Спершу досліди')}</span></span></button>`).join('')}</div>`}
function catalog(){return `<div class="eyebrow">${t('Wissen, was drinsteckt','Знай, що всередині')}</div><h1 style="font-size:36px">${t('Das Gerichte-Labor','Лабораторія страв')}</h1><p>${t('Schau dir Zutaten an und löse zwei Aufgaben. Auch bekannte Gerichte kannst du erneut öffnen.','Переглядай складники та виконуй два завдання. Відомі страви можна відкрити знову.')}</p>${filters(false)}${catalogCards(filtered(false))}`}
function filters(pick){return `<div class="filters">${[['all','Alles','Усе'],['main','Gerichte','Страви'],['break','Frühstück & Brot','Сніданки та хліб'],['extra','Ergänzungen','Доповнення'],['drink','Getränke','Напої']].filter(x=>!pick|| (pending?.slot==='extra'?['all','extra','drink']:['all','main','break']).includes(x[0])).map(x=>`<button class="small ${filter===x[0]?'active':''}" onclick="setFilter('${x[0]}',${pick})">${x[1+S.lang]}</button>`).join('')}</div>`}
function filtered(pick){return FOODS.filter(f=>(!pick||(pending.slot==='extra'?['extra','drink']:['main','break']).includes(f.cat))&&(filter==='all'||f.cat===filter));}
function setFilter(v,pick){filter=v;if(pick)drawPicker();else render();}
function picker(slot){pending={day:S.day,slot};filter=slot==='extra'?'extra':slot===0?'break':'main';drawPicker();}
function drawPicker(){openModal(`<h2>${t('Was bekommt Sam?','Що отримає Сем?')}</h2><p>${t('Unbekannte Gerichte erkundest du zuerst.','Спочатку досліди незнайомі страви.')}</p>${filters(true)}${catalogCards(filtered(true),true)}`);}
function openModal(body){$('modalcontent').innerHTML=`<div class="modalhead"><strong>${t('Entdecken & auswählen','Досліджуй та обирай')}</strong><div><span class="errors" id="modalerrors">${t('Fehlversuche: ','Помилки: ')+S.errors}</span> <button class="small" ${S.lang?'hidden':''} onclick="speak()">🔊 ${t('Vorlesen','Читати')}</button> <button class="small" onclick="closeModal()" aria-label="${t('Schließen','Закрити')}">✕</button></div></div><div class="modalbody">${body}</div>`;if(!$('modal').open)$('modal').showModal();}
function closeModal(){window.speechSynthesis?.cancel();$('modal').close();selected=null;pending=null;busy=false;}
function choose(id){if(S.learn[id]>=2){feed(id);return;}inspect(id,pending);}
function inspect(id,context=null){selected=id;if(context!==null)pending=context;busy=false;qstep=Math.min(lessonProgress(),lessonLimit());drawLesson();}
function drawLesson(){const f=F(selected);if(!f)return;const rows=f.ingredients.map(x=>`<div class="ingredient"><strong>${x[S.lang]}</strong><small>${x[2+S.lang]}</small></div>`).join('');let opts=qstep===0?ingredientOptions(f):qstep===2?reviewQuestion(f).answers:f.answers;let question=qstep===0?t('Welche Zutaten gehören zu unserem Beispiel?','Які складники є в нашому прикладі?'):qstep===2?L(reviewQuestion(f).q):L(f.q);openModal(`<div class="foodtitle"><span class="big">${f.emoji}</span><div><div class="eyebrow">${t('Das ist unser Beispiel','Наш приклад')}</div><h2>${L(f.name)}</h2><p class="muted">${L(f.portion)}</p></div></div><div class="ingredients">${rows}</div><div class="hint">${L(f.info)}</div>${(f.id==='chips'||f.id==='cola')?nutritionTable(f):''}<details ${inReview()?'open':''}><summary>${t('Was macht das im Körper?','Що це робить в організмі?')}</summary><p>${t('Kohlenhydrate liefern Energie. Eiweiß dient als Baustoff. Fett liefert Energie und hilft, bestimmte Vitamine aufzunehmen. Vitamine und Mineralstoffe unterstützen viele Körperaufgaben. Ballaststoffe unterstützen die Verdauung. Wasser transportiert Stoffe und hilft beim Kühlen.','Вуглеводи дають енергію. Білок є будівельним матеріалом. Жир дає енергію та допомагає засвоювати певні вітаміни. Вітаміни й мінерали підтримують роботу організму. Клітковина допомагає травленню. Вода переносить речовини та охолоджує.')}</p></details><div class="question">${qstep>=lessonLimit()?`<div class="hint good">✓ ${t('Gericht erkundet! Du kennst die Zutaten.','Страву досліджено! Ти знаєш складники.')}</div><button class="primary" onclick="lessonDone()">${inReview()?t('Übersicht zum Abschreiben ansehen →','Переглянути огляд для переписування →'):pending==='intro'?t('Meine Woche starten →','Почати мій тиждень →'):pending?t('Sam damit füttern →','Погодувати Сема →'):t('Zurück zur Übersicht','Назад до огляду')}</button>`:`<div class="eyebrow">${t('Aufgabe','Завдання')} ${qstep+1} / ${lessonLimit()}</div><h3>${question}</h3><div class="answers">${opts.map((x,i)=>`<button onclick="answer(${i})" data-answer><span class="letter">${'ABCD'[i]}</span>${L(x)}</button>`).join('')}</div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="next"></div>`}</div><div class="notice">${t('Rezepte und Portionen unterscheiden sich. Wir untersuchen genau dieses Beispiel.','Рецепти й порції відрізняються. Ми досліджуємо саме цей приклад.')}</div>`);updateLock();}
function ingredientOptions(f){let correct=[f.ingredients.map(x=>x[0]).join(', '),f.ingredients.map(x=>x[1]).join(', ')];const wrong=[['Schokolade, Sahne und Zucker','Шоколад, вершки та цукор'],['Pommes, Wurst und Ketchup','Картопля фрі, ковбаса та кетчуп'],['Eis, Honig und Kekse','Морозиво, мед та печиво']];const a=[...wrong];a.splice(FOODS.indexOf(f)%4,0,correct);return a;}
function nutritionTable(f){let cola=f.id==='cola';return `<div class="tablewrap"><table><caption>${t('Vereinfachte Nährwertangaben · Beispielwerte, keine Marke','Спрощені харчові дані · приклад, не бренд')}</caption><tr><th>${t('Nährwert','Показник')}</th><th>${cola?'100 ml':'100 g'}</th><th>${t('Unsere Portion','Наша порція')} ${cola?'250 ml':'30 g'}</th></tr>${(cola?[[t('Zucker','Цукор'),'10,6 g','26,5 g'],[t('Fett','Жир'),'0 g','0 g']]:[[t('Fett','Жир'),'32 g','9,6 g'],[t('davon gesättigte Fettsäuren','із них насичені жири'),'3 g','0,9 g']]).map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;}
function answer(i){if(busy||Date.now()<S.lockUntil||!selected||qstep>=lessonLimit())return;let f=F(selected),correct=qstep===0?FOODS.indexOf(f)%4:qstep===2?reviewQuestion(f).right:f.right;if(i!==correct){S.errors++;S.lockUntil=Date.now()+10000;save();header();updateLock();return;}busy=true;if(inReview())S.review.items[pending.review].step=qstep+1;else S.learn[selected]=qstep+1;save();document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);$('feedback').innerHTML=`<div class="hint good">✓ ${t('Richtig! Gut hingeschaut.','Правильно! Добре розглянуто.')}</div>`;$('next').innerHTML=`<button class="primary" onclick="nextQuestion()">${t('Weiter →','Далі →')}</button>`;}
function nextQuestion(){if(!busy)return;busy=false;qstep=lessonProgress();drawLesson();}
function updateLock(){const fb=$('feedback');if(!fb||busy)return;const sec=Math.max(0,Math.ceil((S.lockUntil-Date.now())/1000));document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=sec>0);if(sec>0){fb.innerHTML=`<div class="hint warn">${t('Das war leider noch nicht richtig! Lies dir die Informationen oben noch einmal genau durch. In 10 Sekunden kannst du es erneut versuchen.','Поки неправильно! Уважно прочитай інформацію вище. Через 10 секунд можна спробувати знову.')}<br><span class="count">${sec}</span> ${t('Sekunden','секунд')}</div>`;}else if(fb.querySelector('.count')){fb.innerHTML=`<span class="count">0</span> · ${t('Du kannst es erneut versuchen.','Можна спробувати знову.')}`;}}
setInterval(updateLock,200);
function lessonDone(){if(inReview()){if(lessonProgress()<3)return;closeModal();S.view='review';save();render();window.scrollTo({top:0,behavior:'smooth'});return;}if(pending==='intro'){closeModal();S.view='plan';save();render();return;}if(pending){feed(selected);return;}closeModal();render();}
function feed(id){if(!pending||pending==='intro'||S.learn[id]<2)return;let p=pending,d=S.days[p.day];if(p.slot==='extra'){if(d.extras.length>=30){toast(t('Für diesen Beispieltag sind genug Ergänzungen eingetragen. Entferne zuerst eine.','Для цього дня вже достатньо доповнень. Спершу видали одне.'));return;}d.extras.push(id);}else d.meals[p.slot]=id;S.day=p.day;S.finished=false;S.view='plan';save();closeModal();render();let scene=$('scene');scene.classList.add('eating');scene.insertAdjacentHTML('beforeend',`<span class="feed">${F(id).emoji}</span>`);setTimeout(()=>scene?.classList.remove('eating'),1200);toast(t('Sam hat ','Сем отримав ')+L(F(id).name)+t(' bekommen.','.') );}
function water(){pending={day:S.day,slot:'extra'};if(S.learn.water>=2)feed('water');else inspect('water',pending);}
function removeExtra(i){S.days[S.day].extras.splice(i,1);S.finished=false;save();render();}
function setDay(i){S.day=i;save();render();}
function finishDay(){if(S.days[S.day].meals.some(x=>!x))return;S.days[S.day].done=true;if(S.day<6)S.day++;else S.view='report';save();render();window.scrollTo({top:0,behavior:'smooth'});}
function allDone(){return S.days.every(d=>d.done&&d.meals.every(id=>F(id)));}
function go(v){if(v==='review'&&!S.review.unlocked){toast(t('Verbessere zuerst deine Woche und schließe sie ab.','Спочатку покращ свій тиждень і заверши його.'));return;}if(v==='report'&&!allDone()){toast(t('Plane zuerst alle sieben Tage mit je drei Mahlzeiten.','Спочатку заплануй сім днів по три прийоми їжі.'));return;}S.view=v;filter='all';save();render();window.scrollTo({top:0,behavior:'smooth'});}
function beginImprove(){if(!allDone())return;if(!S.original)S.original=JSON.parse(JSON.stringify(S.days));S.day=0;S.view='plan';save();render();}
function changes(){if(!S.original)return [];let c=[];S.days.forEach((d,i)=>{d.meals.forEach((id,j)=>{if(id!==S.original[i].meals[j])c.push(`${L(DAYS[i])}, ${L(SLOTS[j])}: ${L(F(S.original[i].meals[j]).name)} → ${L(F(id).name)}`)});let old=S.original[i].extras,now=d.extras;let removed=[],added=[];for(let f of FOODS){let delta=now.filter(x=>x===f.id).length-old.filter(x=>x===f.id).length;if(delta>0)added.push(`${delta} × ${L(f.name)}`);if(delta<0)removed.push(`${-delta} × ${L(f.name)}`);}if(removed.length||added.length)c.push(`${L(DAYS[i])}, ${t('Ergänzungen','доповнення')}: ${removed.length?'− '+removed.join(', '):''} ${added.length?'+ '+added.join(', '):''}`)});return c;}
function weeklyTips(days){let avg=days.map(totals).reduce((a,b)=>a.map((v,i)=>v+b[i]),Array(8).fill(0)).map(x=>x/7);let tips=[];if(avg[0]<5)tips.push(['warn',t('Wasser öfter einplanen','Частіше плануй воду'),t('Wasser oder ungesüßter Tee kommt noch wenig vor. Verteile Getränke über den Tag.','Води або несолодкого чаю поки мало. Розподіли напої протягом дня.')]);else tips.push(['good',t('Wasser ist regelmäßig dabei','Вода є регулярно'),t('Du hast häufig ein Getränk ohne Zucker gewählt.','Ти часто обирав напій без цукру.')]);if(avg[1]<4)tips.push(['warn',t('Mehr Obst und Gemüse ergänzen','Додай більше фруктів та овочів'),t('In vielen Mahlzeiten sind nur kleine Mengen dabei. Ergänze zum Beispiel Salat, Gemüse oder einen Apfel.','У багатьох стравах їх небагато. Додай салат, овочі або яблуко.')]);else tips.push(['good',t('Pflanzliche Vielfalt ist dabei','Є рослинне різноманіття'),t('Obst und Gemüse kommen häufig vor. Wechsle die Sorten ab.','Фрукти та овочі є часто. Чергуй різні види.')]);if(avg[7]>1||flags(days,'sugarDrink')>=4)tips.push(['red',t('Extras genauer anschauen','Переглянь ласощі'),t('Süße Getränke oder Snacks kommen häufig vor. Tausche einige aus. Kleine Extras dürfen bleiben.','Солодкі напої чи перекуси трапляються часто. Заміни деякі. Невеликі ласощі можуть залишитися.')]);else if(flags(days,'sat')>=5)tips.push(['red',t('Bei den Fettquellen abwechseln','Чергуй джерела жирів'),t('Gerichte mit vielen gesättigten Fetten kommen oft vor. Probiere öfter Bohnen, Fisch, Nüsse oder pflanzliche Öle.','Страв із багатьма насиченими жирами чимало. Частіше обирай квасолю, рибу, горіхи чи рослинні олії.')]);else if(flags(days,'pulse')<2)tips.push(['warn',t('Bohnen und Linsen ausprobieren','Спробуй квасолю та сочевицю'),t('Sie liefern Eiweiß und Ballaststoffe. Eine Reis-Bohnen-Pfanne kann für Abwechslung sorgen.','Вони дають білок і клітковину. Рис із квасолею додасть різноманіття.')]);else tips.push(['good',t('Verschiedene Eiweißquellen','Різні джерела білка'),t('Hülsenfrüchte sind dabei. Schau auch bei anderen Gerichten auf Abwechslung.','Є бобові. Подбай про різноманіття й інших страв.')]);return tips;}
function weekTable(days){return `<div class="tablewrap"><table><tr><th>${t('Tag','День')}</th>${SLOTS.map(s=>`<th>${L(s)}</th>`).join('')}<th>${t('Ergänzungen','Доповнення')}</th></tr>${days.map((d,i)=>`<tr><th>${L(DAYS[i])}</th>${d.meals.map(id=>`<td>${F(id).emoji} ${L(F(id).name)}</td>`).join('')}<td>${Object.entries(d.extras.reduce((a,id)=>(a[id]=(a[id]||0)+1,a),{})).map(([id,n])=>`${n} × ${L(F(id).name)}`).join(', ')||'—'}</td></tr>`).join('')}</table></div>`;}
function report(){if(!allDone())return `<div class="hint">${t('Plane zuerst alle sieben Tage.','Спочатку заплануй усі сім днів.')}</div>`;const c=changes();return `<div class="eyebrow">${t('Deine Woche auf einen Blick','Твій тиждень одним поглядом')}</div><h1 style="font-size:36px">${S.finished?t('Geschafft, Wochenprofi!','Готово, знавець тижня!'):t('Was passt? Was fehlt noch?','Що добре? Чого бракує?')}</h1><p>${t('Eine Woche zeigt ein Muster. Sie beweist keinen Mangel und macht niemanden automatisch krank.','Тиждень показує звичку. Він не доводить дефіциту й не робить когось автоматично хворим.')}</p>${S.finished?'<div class="celebrate">🎉</div>':''}${S.review.unlocked?`<div class="hint good"><button class="primary" onclick="go('review')">${t('Weiter: zwei Gerichte analysieren →','Далі: аналіз двох страв →')}</button></div>`:''}<div class="report">${weeklyTips(S.days).map(x=>`<div class="card ${x[0]}"><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><details class="card"><summary>${t('Wenn ich über längere Zeit so esse …','Якщо я так харчуюся тривалий час …')}</summary><p>${t('• Häufig Zucker zu essen oder zu trinken, kann Karies fördern.','• Часте споживання цукру може сприяти карієсу.')}</p><p>${t('• Wenig Ballaststoffe und zu wenig Flüssigkeit können Verstopfung begünstigen.','• Мало клітковини та рідини може сприяти закрепам.')}</p><p>${t('• Viele gesättigte statt ungesättigter Fettsäuren können die Blutfettwerte ungünstig beeinflussen.','• Багато насичених замість ненасичених жирів може погіршувати показники жирів у крові.')}</p><p>${t('• Dauerhaft mehr Energie aufzunehmen als zu verbrauchen, kann zu Übergewicht führen. Das hängt von der gesamten Ernährung und Bewegung ab.','• Постійний надлишок енергії може призводити до надмірної ваги. Це залежить від усього харчування та руху.')}</p><p>${t('• Sehr einseitiges Essen kann langfristig zu einer zu geringen Versorgung mit bestimmten Nährstoffen beitragen. Unsere Balken können keinen Mangel feststellen.','• Дуже одноманітне харчування може з часом сприяти недостатньому надходженню певних поживних речовин. Наші смужки не визначають дефіцит.')}</p></details><h2>${t('Deine aktuelle Woche','Твій поточний тиждень')}</h2>${weekTable(S.days)}${!S.original?`<div class="card" style="margin-top:22px"><h2>${t('Deine Mission: drei Stellen verbessern','Твоя місія: покращити три місця')}</h2><p>${t('Verändere drei Mahlzeiten oder die Ergänzungen an verschiedenen Tagen. Dein Lieblingsgericht darf bleiben. Deine erste Woche wird zum Vergleichen aufbewahrt.','Зміни три прийоми їжі або доповнення в різні дні. Улюблена страва може залишитися. Перший план збережеться для порівняння.')}</p><button class="primary" onclick="beginImprove()">${t('Woche verbessern →','Покращити тиждень →')}</button></div>`:`<div class="card" style="margin-top:22px"><h2>${t('Das habe ich verändert','Що я змінив')}</h2><p>${c.length} / 3 ${t('Stellen verändert (mindestens)','місця змінено (мінімум)')}</p><ul>${c.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><label for="reason"><strong>${t('Ich habe … verändert, weil …','Я змінив …, тому що …')}</strong></label><textarea id="reason" oninput="S.reason=this.value;S.finished=false;save();updateFinish()" placeholder="${t('Erkläre, warum deine Änderungen zur Woche passen.','Поясни, чому зміни підходять до тижня.')}">${esc(S.reason)}</textarea><p class="muted">${t('Jede geänderte Mahlzeit zählt als eine Stelle. Alle Ergänzungen eines Tages zählen zusammen als eine Stelle. Nicht jede Änderung ist automatisch eine Verbesserung: Begründe deine Wahl.','Кожен змінений прийом їжі — одне місце. Усі доповнення одного дня разом — одне місце. Не кожна зміна автоматично краща: поясни свій вибір.')}</p><button onclick="go('plan')">${t('Weiter verändern','Продовжити зміни')}</button> <button id="finish" class="primary" onclick="finish()" ${c.length<3||S.reason.trim().length<10?'disabled':''}>${t('Woche abschließen ✓','Завершити тиждень ✓')}</button></div><details class="card"><summary>${t('Meine ursprüngliche Woche anzeigen','Показати початковий тиждень')}</summary>${weekTable(S.original)}</details>`}<p class="muted" style="margin-top:18px">${t('Fehlversuche bei den Lernaufgaben: ','Помилки у навчальних завданнях: ')}${S.errors}. ${t('Ausprobieren im Wochenplan zählt nicht als Fehler.','Експерименти у плані не є помилками.')}</p>`;}
function updateFinish(){let b=$('finish');if(b)b.disabled=changes().length<3||S.reason.trim().length<10;}
function finish(){if(changes().length<3||S.reason.trim().length<10)return;S.finished=true;S.review.unlocked=true;S.view='review';save();render();window.scrollTo({top:0,behavior:'smooth'});}
function language(){window.speechSynthesis?.cancel();S.lang=1-S.lang;save();render();if($('modal').open){if(selected){busy=false;qstep=Math.min(lessonProgress(),lessonLimit());drawLesson();}else if(inReview())reviewPicker(pending.review);else if(pending)drawPicker();}}
function speak(){if(!('speechSynthesis' in window)){toast('Vorlesen wird hier nicht unterstützt.');return;}if(speechSynthesis.speaking){speechSynthesis.cancel();return;}const el=$('modal').open?$('modalcontent'):$('app');const utter=new SpeechSynthesisUtterance(el.innerText);utter.lang='de-DE';utter.rate=.9;speechSynthesis.speak(utter);}
function resetGame(){if(!confirm(t('Wirklich neu starten? Woche, Lernfortschritt und Fehlversuche werden gelöscht.','Справді почати заново? Тиждень, прогрес і помилки буде видалено.')))return;closeModal();S=blank();save();render();}
function footer(){return `<footer class="footer"><details><summary>${t('Für Lehrkräfte · Modell und Quellen','Для вчителів · Модель та джерела')}</summary><p>${t('Lernmodell für die 8. Klasse. Die Zuordnung unserer Beispielrezepte zu Portionen ist didaktisch vereinfacht und nicht gewogen. Ein Balken ist keine Messung des individuellen Tagesbedarfs. Rot kennzeichnet bei Ölen oder Extras das Überschreiten der Modellorientierung, keine Krankheit. Die Wochenhinweise nutzen feste Lernregeln: z. B. weniger als vier Obst-/Gemüseportionen im Tagesmittel oder mehr als eine Extra-Portion. Sie ersetzen keine individuelle Ernährungsberatung.','Навчальна модель для 8 класу. Поділ рецептів на порції спрощений, не зважений. Смужки не вимірюють особисту добову потребу. Червоний колір означає перевищення орієнтиру моделі для олії чи ласощів, а не хворобу. Поради базуються на навчальних правилах, наприклад менше чотирьох порцій овочів/фруктів або більше однієї порції ласощів у середньому за день. Це не індивідуальна консультація.')}</p><p>${t('Die Karten zeigen zentrale Nährstoffe, keine vollständige Analyse. Fett- und Zuckerzahlen bei Chips und Cola sind gekennzeichnete Beispielwerte. Die DGE-Empfehlungen für Erwachsene werden hier nicht als individuelle Mengenempfehlung für Jugendliche verwendet.','Картки показують основні поживні речовини, а не повний аналіз. Числа для чипсів та коли — приклади. Рекомендації DGE для дорослих не використано як особисті кількісні норми для підлітків.')}</p><ul><li><a target="_blank" rel="noopener" href="https://www.bzfe.de/essen-und-gesundheit/ernaehrungspyramide/wieviel-esse-ich-wovon">BZfE: Portionen und Ernährungspyramide</a></li><li><a target="_blank" rel="noopener" href="https://www.dge.de/gesunde-ernaehrung/gut-essen-und-trinken/dge-empfehlungen/">DGE: Gut essen und trinken</a></li><li><a target="_blank" rel="noopener" href="https://www.dge.de/gesunde-ernaehrung/gut-essen-und-trinken/dge-ernaehrungskreis/oele-und-fette/">DGE: Öle und Fette</a></li></ul><p>${t('Fortschritt bleibt nur in diesem Browser. Auf gemeinsam genutzten Geräten bewusst neu starten. Vorlesen nutzt die Stimmen des Geräts. Kein Konto nötig.','Прогрес зберігається лише в цьому браузері. На спільному пристрої почни заново. Озвучення використовує голоси пристрою. Обліковий запис не потрібен.')}</p><button class="small" onclick="downloadHTML()">${t('↓ HTML-Datei herunterladen','↓ Завантажити HTML')}</button></details></footer>`}
function downloadHTML(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#modalcontent').innerHTML='';clone.querySelector('#modal').removeAttribute('open');clone.querySelector('#toast').hidden=true;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>'+clone.outerHTML],{type:'text/html;charset=utf-8'}));a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
$('modal').addEventListener('cancel',()=>{selected=null;pending=null;busy=false;});
render();
</script></body></html>
